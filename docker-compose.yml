# Docker Compose file for the job-market-etl project.
# Two services:
#   postgres  - the PostgreSQL database (runs all the time)
#   pipeline  - the ETL job (runs once, loads the data, then exits)
#
# Start everything:        docker compose up --build
# Start only the database: docker compose up -d postgres
# Run the pipeline again:  docker compose run --rm pipeline
# Stop everything:         docker compose down

services:
  postgres:
    # Official PostgreSQL image, pinned to major version 17 so the setup
    # doesn't change unexpectedly when a new major version comes out.
    image: postgres:17
    container_name: job-market-postgres
    restart: unless-stopped

    # Credentials come from the .env file in the project root.
    # Docker Compose reads .env automatically and substitutes ${...} values.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Expose Postgres on localhost:5432 so tools on your machine
    # (psql, DBeaver, and later our Python code) can connect to it.
    ports:
      - "5432:5432"

    volumes:
      # Named volume: keeps the database data even if the container is removed.
      - pgdata:/var/lib/postgresql/data
      # Scripts in /docker-entrypoint-initdb.d/ run ONCE, only when the
      # database is created for the first time (i.e. the volume is empty).
      # ":ro" = read-only, the container cannot modify our file.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # Healthcheck: Docker runs pg_isready periodically to see whether
    # Postgres is accepting connections. `docker compose ps` shows the result.
    # "$$" escapes "$" so the variable is expanded inside the container, not by Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pipeline:
    # Build the image from the Dockerfile in this folder.
    build: .

    # Load the same settings as the database (POSTGRES_DB, USER, PASSWORD, ...).
    env_file: .env

    # Values in "environment" win over env_file.
    # Inside a container, "localhost" means the container ITSELF, not your
    # computer, so localhost:5432 would find nothing. Compose puts all services
    # on a shared network where each service can be reached by its name, so the
    # database is at host "postgres". Port 5432 is Postgres' port inside that
    # network (the "5432:5432" mapping above is only for your computer).
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

    # Don't start until the postgres healthcheck passes (not just "started"),
    # otherwise the pipeline could try to connect before Postgres is ready.
    depends_on:
      postgres:
        condition: service_healthy

    # Share ./data with the container, so raw JSON files written to
    # /app/data/raw inside the container end up in ./data/raw on your computer.
    volumes:
      - ./data:/app/data

    # A batch job: it runs once and exits. "no" = never restart it automatically
    # (this is the default; written out here to make it explicit).
    restart: "no"

# Named volumes are declared here; Docker manages where they live on disk.
volumes:
  pgdata:
